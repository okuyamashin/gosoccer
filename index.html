            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent browser scrolling on canvas */

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);

            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

            animation: slideUp 0.3s ease-out forwards;
        }

    <!-- Monte Carlo CPU, run as a Web Worker so the page stays responsive -->
    <script type="text/worker" id="cpu-worker">
        // For each legal move, play random games to the end (UCB1 decides which move to try
        // next) and choose the move that was tried most, i.e. the most promising one.
        self.onmessage = (e) => {
            const { token, board, adj, color, komi, history, timeMs } = e.data;
            const N = board.length;
            const enemyOf = c => c === 'B' ? 'W' : 'B';
            const seen = new Set(history);
            const key = b => b.map(c => c || '.').join('');

            function group(b, start) {
                const c = b[start], g = [start], visited = new Set(g);
                for (let k = 0; k < g.length; k++) {
                    for (const n of adj[g[k]]) {
                        if (b[n] === c && !visited.has(n)) { visited.add(n); g.push(n); }
                    }
                }
                return g;
            }
            function hasLiberty(b, g) {
                return g.some(x => adj[x].some(n => b[n] === null));
            }
            // Plays c at i on b; false (b unchanged) if it is suicide
            function play(b, i, c) {
                const enemy = enemyOf(c);
                b[i] = c;
                let captured = false;
                for (const n of adj[i]) {
                    if (b[n] === enemy) {
                        const g = group(b, n);
                        if (!hasLiberty(b, g)) { g.forEach(x => b[x] = null); captured = true; }
                    }
                }
                if (!captured && !hasLiberty(b, group(b, i))) { b[i] = null; return false; }
                return true;
            }
            const isOwnEye = (b, i, c) => adj[i].every(n => b[n] === c);

            function playout(b, c) {
                let passes = 0;
                for (let moves = 0; passes < 2 && moves < 300; moves++) {
                    const cands = [];
                    for (let i = 0; i < N; i++) if (b[i] === null && !isOwnEye(b, i, c)) cands.push(i);
                    let played = false;
                    while (cands.length > 0 && !played) {
                        const pick = cands.splice(Math.floor(Math.random() * cands.length), 1)[0];
                        played = play(b, pick, c);
                    }
                    passes = played ? 0 : passes + 1;
                    c = enemyOf(c);
                }
            }
            // Area score from color's side, komi to White
            function margin(b) {
                let s = { B: 0, W: komi };
                const visited = new Uint8Array(N);
                for (let i = 0; i < N; i++) {
                    if (b[i] !== null) { s[b[i]]++; continue; }
                    if (visited[i]) continue;
                    const region = [i], borders = new Set();
                    visited[i] = 1;
                    for (let k = 0; k < region.length; k++) {
                        for (const n of adj[region[k]]) {
                            if (b[n] === null) { if (!visited[n]) { visited[n] = 1; region.push(n); } }
                            else borders.add(b[n]);
                        }
                    }
                    if (borders.size === 1) s[[...borders][0]] += region.length;
                }
                return color === 'B' ? s.B - s.W : s.W - s.B;
            }

            // Candidate moves: legal, not filling own eyes, not repeating a position
            const cands = [];
            for (let i = 0; i < N; i++) {
                if (board[i] !== null || isOwnEye(board, i, color)) continue;
                const b = board.slice();
                if (play(b, i, color) && !seen.has(key(b))) cands.push({ i, after: b, n: 0, wins: 0 });
            }
            if (cands.length === 0) {
                self.postMessage({ token, move: -1 });
                return;
            }

            const start = Date.now();
            let total = 0;
            while (total < cands.length || Date.now() - start < timeMs) {
                let best = null, bestU = -Infinity;
                for (const c of cands) {
                    const u = c.n === 0 ? Infinity : c.wins / c.n + Math.sqrt(2 * Math.log(total) / c.n);
                    if (u > bestU) { bestU = u; best = c; }
                }
                const b = best.after.slice();
                playout(b, enemyOf(color));
                best.n++;
                if (margin(b) > 0) best.wins++;
                total++;
            }

            let chosen = cands[0];
            for (const c of cands) if (c.n > chosen.n) chosen = c;
            self.postMessage({ token, move: chosen.i, winRate: chosen.wins / chosen.n, playouts: total });
        };
    </script>

        function applyWoodTexture(material, url) {
            new THREE.TextureLoader().load(url, (tex) => {
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(1, tex.image.width / tex.image.height); // Keep the grain's proportions
                tex.anisotropy = 4;
                material.map = tex;
                material.color.set(0xffffff);
                material.needsUpdate = true;
            });
        }
        applyWoodTexture(matPentagon, 'textures/wood_dark.jpg');
        applyWoodTexture(matHexagon, 'textures/wood_light.jpg');

        window.onload = () => {
            initMathGraph();

        function initMathGraph() {
            // 1. Generate Icosahedron vertices
            const t = (1 + Math.sqrt(5)) / 2;
            const icosaV = [
                new THREE.Vector3(-1,  t,  0), new THREE.Vector3( 1,  t,  0),
                new THREE.Vector3(-1, -t,  0), new THREE.Vector3( 1, -t,  0),
                new THREE.Vector3( 0, -1,  t), new THREE.Vector3( 0,  1,  t),
                new THREE.Vector3( 0, -1, -t), new THREE.Vector3( 0,  1, -t),
                new THREE.Vector3( t,  0, -1), new THREE.Vector3( t,  0,  1),
                new THREE.Vector3(-t,  0, -1), new THREE.Vector3(-t,  0,  1)
            ];

            // 2. Find the 30 edges of Icosahedron (distance = 2)
            let edges = [];
            const isEdge = (i, j) => Math.abs(icosaV[i].distanceTo(icosaV[j]) - 2.0) < 0.05;
            for(let i = 0; i < 12; i++){
                for(let j = i + 1; j < 12; j++){
                    if(isEdge(i, j)){
                        edges.push([i, j]);
                    }
                }
            }

            // 3. Truncate edges at 1/3 and 2/3 to get 60 vertices
            const SCALE = 4; // Make the ball bigger
            let edgePoints = {}; // "i-j" -> the two points on that icosahedron edge
            let pentagonOf = Array.from({length: 12}, () => []);
            edges.forEach(([i, j]) => {
                let p1 = icosaV[i].clone().lerp(icosaV[j], 1/3).multiplyScalar(SCALE);
                let p2 = icosaV[i].clone().lerp(icosaV[j], 2/3).multiplyScalar(SCALE);
                points.push(p1, p2);
                let n = points.length;
                edgePoints[`${i}-${j}`] = [n - 2, n - 1];
                // Each cut point belongs to the pentagon around its nearer icosahedron vertex
                pentagonOf[i].push(n - 2);
                pentagonOf[j].push(n - 1);
            });
            pentagons = pentagonOf;

            // Each icosahedron triangle becomes a hexagon of the 6 points on its edges
            for(let i = 0; i < 12; i++){
                for(let j = i + 1; j < 12; j++){
                    for(let k = j + 1; k < 12; k++){
                        if(isEdge(i, j) && isEdge(j, k) && isEdge(i, k)){
                            hexagons.push([
                                ...edgePoints[`${i}-${j}`], ...edgePoints[`${j}-${k}`], ...edgePoints[`${i}-${k}`]
                            ]);
                        }
                    }
                }
            }

            // 4. Calculate Adjacency list (distance between neighbors is ~ 2.666 when scaled by 4)
            const targetDist = (2/3) * SCALE;
            for(let i = 0; i < TOTAL_NODES; i++){
                for(let j = i + 1; j < TOTAL_NODES; j++){
                    let d = points[i].distanceTo(points[j]);
                    if(Math.abs(d - targetDist) < 0.1){
                        adj[i].push(j);
                        adj[j].push(i);
                    }
                }
            }
        }

        function initThreeJS() {
            // Scene Setup
            scene = new THREE.Scene();
            // Optional: add some subtle fog to blend into background
            scene.fog = new THREE.FogExp2(0x0f172a, 0.02);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 15);

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = false;
            controls.minDistance = 8;
            controls.maxDistance = 25;
            fitCamera();
            // The panel grows when the result check or messages appear; keep the ball below it
            new ResizeObserver(() => fitCamera()).observe(document.getElementById('panel'));

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(10, 10, 10);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xaabbff, 0.5);
            dirLight2.position.set(-10, -10, -10);
            scene.add(dirLight2);

            // 360-degree background: the view from an engawa over a Japanese garden
            backgroundSphere = createBackground();
            scene.add(backgroundSphere);

            // Truncated icosahedron (soccer ball) faces: pentagons and hexagons in separate woods
            scene.add(new THREE.Mesh(buildFaces(pentagons), matPentagon));
            scene.add(new THREE.Mesh(buildFaces(hexagons), matHexagon));

            // Draw Edges (Cylinders)
            let drawnEdges = new Set();
            for(let i = 0; i < TOTAL_NODES; i++){
                adj[i].forEach(neighbor => {
                    let edgeKey = i < neighbor ? `${i}-${neighbor}` : `${neighbor}-${i}`;
                    if(!drawnEdges.has(edgeKey)) {
                        drawnEdges.add(edgeKey);
                        let p1 = points[i];
                        let p2 = points[neighbor];
                        let dist = p1.distanceTo(p2);
                        
                        let cylGeo = new THREE.CylinderGeometry(0.04, 0.04, dist, 8);
                        let edgeMesh = new THREE.Mesh(cylGeo, matEdge);
                        
                        edgeMesh.position.copy(p1).lerp(p2, 0.5);
                        edgeMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), p2.clone().sub(p1).normalize());
                        scene.add(edgeMesh);
                    }
                });
            }

            // Draw Nodes (Clickable Intersections)
            const sphereGeo = new THREE.SphereGeometry(0.6, 32, 32);
            for(let i = 0; i < TOTAL_NODES; i++){
                let mesh = new THREE.Mesh(sphereGeo, matEmpty);
                mesh.position.copy(points[i]);
                mesh.scale.set(0.2, 0.2, 0.2); // Start small (empty indicator)
                mesh.userData = { index: i }; // Store graph index for Raycaster

                let halo = new THREE.Mesh(sphereGeo, matAtari);
                halo.scale.set(1.2, 1.2, 1.2);
                halo.visible = false;
                mesh.add(halo);
                mesh.userData.halo = halo;

                scene.add(mesh);
                nodeMeshes.push(mesh);
            }

            // Last-move marker: a small dot on the outer side of the stone
            lastMoveMarker = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), matLastMove);
            lastMoveMarker.visible = false;
            scene.add(lastMoveMarker);

            // Event Listeners for Interaction
            setupInteraction();

            // Window Resize
            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                fitCamera();
            });
        }

        // --- BACKGROUND ---
        // How much the background turns when the ball is turned: 1 = like a real room around
        // the ball (full 3D feel), 0 = fixed on screen. Lower it if the motion feels too strong.
        const BACKGROUND_TURN = 1.0;
        const BACKGROUND_BRIGHTNESS = 0xc0c0c0; // Darkened a little so the board stands out

        // Equirectangular panorama (pre-blurred) on a large sphere seen from inside.
        // Generated with Gemini; see TODO.md "使用素材".
        function createBackground() {
            const geo = new THREE.SphereGeometry(80, 64, 32);
            geo.scale(-1, 1, 1);         // Seen from inside, so flip it to keep the picture unmirrored
            geo.rotateY(-Math.PI / 2);   // Garden (image center) behind the ball at the start
            const mat = new THREE.MeshBasicMaterial({ color: 0x0f172a, fog: false, depthWrite: false });
            new THREE.TextureLoader().load('textures/background_engawa.jpg', (tex) => {
                mat.map = tex;
                mat.color.set(BACKGROUND_BRIGHTNESS);
                mat.needsUpdate = true;
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.renderOrder = -1;
            return mesh;
        }

        // Keep the background centered on the camera (infinitely far away) and let it
        // follow the camera's turn by (1 - BACKGROUND_TURN)
        function updateBackground() {
            if (!initialCameraTurn) initialCameraTurn = camera.quaternion.clone().invert();
            backgroundSphere.position.copy(camera.position);
            const turned = camera.quaternion.clone().multiply(initialCameraTurn);
            backgroundSphere.quaternion.copy(new THREE.Quaternion().slerp(turned, 1 - BACKGROUND_TURN));
        }

        // Flat polygons as a triangle fan, with UVs projected onto each face's own plane.
        // Every face gets a random grain direction and offset so no two pieces look alike.
        function buildFaces(faces) {
            const UV_SCALE = 1 / 8; // One texture width covers 8 units (a hexagon is about 5 wide)
            let positions = [];
            let uvs = [];
            faces.forEach(face => {
                let center = new THREE.Vector3();
                face.forEach(i => center.add(points[i]));
                center.divideScalar(face.length);
                let normal = center.clone().normalize();

                // Axes on the face plane, turned by a random angle
                let axisU = points[face[0]].clone().sub(center).projectOnPlane(normal).normalize();
                axisU.applyAxisAngle(normal, Math.random() * Math.PI * 2);
                let axisV = new THREE.Vector3().crossVectors(normal, axisU);
                let offset = [Math.random(), Math.random()];

                // Order the corners around the center
                let sorted = [...face].sort((a, b) => {
                    let da = points[a].clone().sub(center), db = points[b].clone().sub(center);
                    return Math.atan2(da.dot(axisV), da.dot(axisU)) - Math.atan2(db.dot(axisV), db.dot(axisU));
                });

                const uvOf = (p) => {
                    let d = p.clone().sub(center);
                    return [d.dot(axisU) * UV_SCALE + offset[0], d.dot(axisV) * UV_SCALE + offset[1]];
                };
                for (let k = 0; k < sorted.length; k++) {
                    let a = points[sorted[k]], b = points[sorted[(k + 1) % sorted.length]];
                    [center, a, b].forEach(p => {
                        positions.push(p.x, p.y, p.z);
                        uvs.push(...uvOf(p));
                    });
                }
            });
            let geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geo.computeVertexNormals();
            return geo;
        }

        // Fit the whole ball into the screen area below the UI panel, on any aspect ratio
        function fitCamera() {
            const W = window.innerWidth, H = window.innerHeight;
            const panelBottom = Math.min(document.getElementById('panel').getBoundingClientRect().bottom, H * 0.5);
            const freeH = H - panelBottom;

            const ballRadius = Math.max(...points.map(p => p.length())) + 0.6; // + stone radius
            const tanHalfV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
            // Half-angle available for the ball: limited by the free height or by the width
            const tanHalf = Math.min(tanHalfV * freeH / H, tanHalfV * W / H);
            const dist = ballRadius * 1.08 / Math.sin(Math.atan(tanHalf));

            // Keep the current viewing direction, change only the distance
            camera.position.setLength(dist);
            controls.maxDistance = Math.max(25, dist * 1.5);

            // Shift the picture down so the ball is centered in the free area
            camera.aspect = W / H;
            camera.setViewOffset(W, H, 0, -(panelBottom / 2), W, H);
            camera.updateProjectionMatrix();

            // Keep the same amount of fog as at the original distance of 15
            scene.fog.density = 0.02 * 15 / dist;
        }

        function setupInteraction() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let pointerDownPos = {x: 0, y: 0};

            renderer.domElement.addEventListener('pointerdown', (e) => {
                focusAnim = null; // The player takes over the view
                pointerDownPos.x = e.clientX;
                pointerDownPos.y = e.clientY;
            });

            renderer.domElement.addEventListener('pointerup', (e) => {
                // Ignore if it was a drag (rotating camera)
                let dx = e.clientX - pointerDownPos.x;
                let dy = e.clientY - pointerDownPos.y;
                if(Math.sqrt(dx*dx + dy*dy) > 5) return;

                // Raycast
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(nodeMeshes);

                if(intersects.length > 0) {
                    let clickedIndex = intersects[0].object.userData.index;
                    if (scoring) {
                        if (board[clickedIndex] !== null) toggleDead(clickedIndex);
                        return;
                    }
                    // Prevent player from clicking during CPU turn
                    if (!isCPUTurn && currentPlayer === 'B') {
                        attemptMove(clickedIndex);
                    }
                }
            });
        }

        // --- GO LOGIC ---

        function attemptMove(index) {
            if(gameOver || scoring || board[index] !== null) return; // Game finished or already occupied

            // Save state for rollback (Ko / Suicide)
            let prevBoard = [...board];
            
            // 1. Place stone tentatively
            board[index] = currentPlayer;
            let enemy = currentPlayer === 'B' ? 'W' : 'B';
            let capturedEnemyStones = [];

            // 2. Check enemy groups for capture
            let enemyGroups = findGroups(enemy);
            enemyGroups.forEach(grp => {
                if(getLiberties(grp) === 0) {
                    capturedEnemyStones.push(...grp);
                }
            });

            // Apply captures
            capturedEnemyStones.forEach(idx => board[idx] = null);

            // 3. Suicide rule check
            let myGroup = getGroup(index);
            if(getLiberties(myGroup) === 0) {
                // Move is illegal (Suicide)
                board = prevBoard; 
                showToast(t('suicide'));
                return;
            }

            // 4. Ko rule check (positional superko: no earlier position may recur)
            let currentHash = boardKey(board);
            if(positionHistory.has(currentHash)) {
                board = prevBoard;
                if(currentPlayer === 'B') showToast(t('ko'));
                return;
            }

            // --- Move is VALID ---
            positionHistory.add(currentHash);
            lastMove = index;
            if (currentPlayer === 'W' && followCpuMoves()) focusOn(index);
            consecutivePasses = 0; // Reset pass counter

            if(currentPlayer === 'B') captures.B += capturedEnemyStones.length;
            else captures.W += capturedEnemyStones.length;

            updateBoardVisuals();
            updateOutlook();

            // Swap turns
            currentPlayer = enemy;
            updateUI();

            // Trigger CPU if it's White's turn
            if (currentPlayer === 'W') {
                isCPUTurn = true;
                setTimeout(playCPU, 500);
            } else {
                isCPUTurn = false;
            }
        }

        // Position key for the ko check. Empty points must map to a character,
        // otherwise different positions collapse to the same string.
        function boardKey(b) {
            return b.map(c => c || '.').join('');
        }

        // Graph Algorithms
        function getGroup(startIndex) {
            let color = board[startIndex];
            let visited = new Set([startIndex]);
            let queue = [startIndex];
            let group = [];

            while(queue.length > 0) {
                let curr = queue.shift();
                group.push(curr);
                adj[curr].forEach(neighbor => {
                    if(board[neighbor] === color && !visited.has(neighbor)) {
                        visited.add(neighbor);
                        queue.push(neighbor);
                    }
                });
            }
            return group;
        }

        function findGroups(color) {
            let visited = new Set();
            let groups = [];
            for(let i = 0; i < TOTAL_NODES; i++) {
                if(board[i] === color && !visited.has(i)) {
                    let grp = getGroup(i);
                    grp.forEach(n => visited.add(n));
                    groups.push(grp);
                }
            }
            return groups;
        }

        function getLiberties(group) {
            let libs = new Set();
            group.forEach(node => {
                adj[node].forEach(neighbor => {
                    if(board[neighbor] === null) {
                        libs.add(neighbor);
                    }
                });
            });
            return libs.size;
        }

        // --- CPU AI ---
        function playCPU() {
            if (gameOver || scoring || currentPlayer !== 'W') return;
            if (cpuLevel === 'easy' || !cpuWorker) {
                playHeuristic();
                return;
            }

            // Monte Carlo search runs in the worker; the answer comes back in cpuWorker.onmessage
            const token = ++cpuToken;
            setThinking(true);
            cpuWorker.postMessage({
                token,
                board,
                adj,
                color: 'W',
                komi,
                history: [...positionHistory],
                timeMs: CPU_THINK_MS[cpuLevel]
            });
        }

        // Easy level: one move ahead, scoring captures and liberties
        function playHeuristic() {
            let validMoves = [];
            let bestMove = -1;
            let bestScore = -9999;

            for (let i = 0; i < TOTAL_NODES; i++) {
                if (board[i] !== null) continue;
                if (isOwnEye(i, 'W')) continue; // Never fill own eyes

                // Simulate move
                let prevBoard = [...board];
                board[i] = 'W';
                let enemy = 'B';
                let captured = 0;

                // Check captures
                let enemyGroups = findGroups(enemy);
                enemyGroups.forEach(grp => {
                    if (getLiberties(grp) === 0) {
                        captured += grp.length;
                        grp.forEach(idx => board[idx] = null);
                    }
                });

                let myGroup = getGroup(i);
                let myLibs = getLiberties(myGroup);
                
                let isSuicide = myLibs === 0;
                let isKo = positionHistory.has(boardKey(board));

                if (!isSuicide && !isKo) {
                    // Valid move, evaluate heuristics
                    let score = 0;
                    score += captured * 50; // Prioritize capturing stones
                    
                    // Prioritize saving own stones (expanding liberties)
                    if (myLibs > 1) {
                        score += myLibs * 2;
                    }
                    
                    // Add slight random variation so CPU doesn't always play same way
                    score += Math.random() * 5;

                    validMoves.push(i);
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }

                // Revert board state for next simulation
                board = [...prevBoard];
            }

            if (validMoves.length > 0 && bestMove !== -1) {
                attemptMove(bestMove);
                return;
            }

            cpuHasNoMove();
        }

        // No useful move left: resign if behind (dead stones not counted), otherwise pass
        function cpuHasNoMove() {
            let score = computeScore(estimateDeadStones('W'));
            if (score.W < score.B) {
                resign(score);
            } else {
                passTurn();
            }
        }

        // An empty point whose neighbors are all stones of the given color
        function isOwnEye(index, color) {
            return adj[index].every(n => board[n] === color);
        }

        // --- SCORING (area scoring: stones + surrounded empty points, komi to White) ---
        // Owner of every point ('B', 'W' or null) on board b
        function areaOwnership(b) {
            let owner = new Array(TOTAL_NODES).fill(null);
            let visited = new Set();
            for (let i = 0; i < TOTAL_NODES; i++) {
                if (b[i] !== null) {
                    owner[i] = b[i];
                    continue;
                }
                if (visited.has(i)) continue;

                // Flood-fill the empty region and record which colors border it
                let region = [];
                let borders = new Set();
                let queue = [i];
                visited.add(i);
                while (queue.length > 0) {
                    let curr = queue.shift();
                    region.push(curr);
                    adj[curr].forEach(n => {
                        if (b[n] === null) {
                            if (!visited.has(n)) {
                                visited.add(n);
                                queue.push(n);
                            }
                        } else {
                            borders.add(b[n]);
                        }
                    });
                }
                if (borders.size === 1) {
                    let color = [...borders][0];
                    region.forEach(n => owner[n] = color);
                }
            }
            return owner;
        }

        // Board with the given dead stones taken off
        function boardWithoutDead(dead) {
            return board.map((c, i) => dead.has(i) ? null : c);
        }

        function computeScore(dead = new Set()) {
            let score = { B: 0, W: komi };
            areaOwnership(boardWithoutDead(dead)).forEach(c => { if (c) score[c]++; });
            return score;
        }

        // --- DEAD STONE ESTIMATE (Monte Carlo) ---
        // From the current position, play many random games to the end and see who
        // usually owns each point. A group whose points usually end up the opponent's is dead.
        const PLAYOUTS = 400;

        function estimateDeadStones(firstToMove) {
            let ownerSum = new Array(TOTAL_NODES).fill(0); // +1 Black, -1 White
            for (let k = 0; k < PLAYOUTS; k++) {
                let b = randomPlayout([...board], firstToMove);
                areaOwnership(b).forEach((c, i) => {
                    if (c === 'B') ownerSum[i]++;
                    else if (c === 'W') ownerSum[i]--;
                });
            }

            let dead = new Set();
            let seen = new Set();
            for (let i = 0; i < TOTAL_NODES; i++) {
                if (board[i] === null || seen.has(i)) continue;
                let grp = getGroup(i);
                grp.forEach(n => seen.add(n));
                let mean = grp.reduce((sum, n) => sum + ownerSum[n], 0) / (grp.length * PLAYOUTS);
                let ownSign = board[i] === 'B' ? 1 : -1;
                if (mean * ownSign < 0) grp.forEach(n => dead.add(n)); // Usually owned by the opponent
            }
            return dead;
        }

        // Random game on board b until neither side has a move other than filling its own eyes
        function randomPlayout(b, color) {
            let passes = 0;
            for (let moves = 0; passes < 2 && moves < 300; moves++) {
                let candidates = [];
                for (let i = 0; i < TOTAL_NODES; i++) {
                    if (b[i] === null && !adj[i].every(n => b[n] === color)) candidates.push(i);
                }
                let played = false;
                while (candidates.length > 0 && !played) {
                    let pick = candidates.splice(Math.floor(Math.random() * candidates.length), 1)[0];
                    played = tryPlayoutMove(b, pick, color);
                }
                passes = played ? 0 : passes + 1;
                color = color === 'B' ? 'W' : 'B';
            }
            return b;
        }

        // Plays color at index on b if it is not suicide (ko is ignored in playouts)
        function tryPlayoutMove(b, index, color) {
            const enemy = color === 'B' ? 'W' : 'B';
            b[index] = color;
            let captured = false;
            adj[index].forEach(n => {
                if (b[n] === enemy) {
                    let grp = groupOn(b, n);
                    if (libertiesOn(b, grp) === 0) {
                        grp.forEach(x => b[x] = null);
                        captured = true;
                    }
                }
            });
            if (!captured && libertiesOn(b, groupOn(b, index)) === 0) {
                b[index] = null;
                return false;
            }
            return true;
        }

        function groupOn(b, start) {
            let color = b[start];
            let group = [start];
            let visited = new Set(group);
            for (let k = 0; k < group.length; k++) {
                adj[group[k]].forEach(n => {
                    if (b[n] === color && !visited.has(n)) {
                        visited.add(n);
                        group.push(n);
                    }
                });
            }
            return group;
        }

        function libertiesOn(b, group) {
            let libs = new Set();
            group.forEach(node => adj[node].forEach(n => { if (b[n] === null) libs.add(n); }));
            return libs.size;
        }

        // --- OUTLOOK: has the player (Black) certainly lost? ---
        // Points that are White's for sure, via Benson's algorithm: White chains that
        // stay alive even if White always passes, plus Black-free eyes they enclose.
        function whiteSecuredPoints() {
            const chainId = new Array(TOTAL_NODES).fill(-1);
            const chains = [];
            for (let i = 0; i < TOTAL_NODES; i++) {
                if (board[i] === 'W' && chainId[i] < 0) {
                    let grp = getGroup(i);
                    grp.forEach(n => chainId[n] = chains.length);
                    chains.push(grp);
                }
            }

            // Regions: connected areas of non-White points, with the White chains around them
            const regionId = new Array(TOTAL_NODES).fill(-1);
            const regions = [];
            for (let i = 0; i < TOTAL_NODES; i++) {
                if (board[i] === 'W' || regionId[i] >= 0) continue;
                let region = { points: [], borders: new Set() };
                let queue = [i];
                regionId[i] = regions.length;
                while (queue.length > 0) {
                    let curr = queue.shift();
                    region.points.push(curr);
                    adj[curr].forEach(n => {
                        if (board[n] === 'W') {
                            region.borders.add(chainId[n]);
                        } else if (regionId[n] < 0) {
                            regionId[n] = regions.length;
                            queue.push(n);
                        }
                    });
                }
                regions.push(region);
            }

            // A region is vital to a chain if every empty point in it is a liberty of that chain
            const isVital = (r, c) => r.points.every(p =>
                board[p] !== null || adj[p].some(n => chainId[n] === c));

            let aliveChains = new Set(chains.keys());
            let enclosedRegions = new Set(regions.keys());
            let changed = true;
            while (changed) {
                changed = false;
                enclosedRegions.forEach(r => {
                    if ([...regions[r].borders].some(c => !aliveChains.has(c))) {
                        enclosedRegions.delete(r);
                        changed = true;
                    }
                });
                aliveChains.forEach(c => {
                    let vitalCount = 0;
                    enclosedRegions.forEach(r => {
                        if (regions[r].borders.has(c) && isVital(regions[r], c)) vitalCount++;
                    });
                    if (vitalCount < 2) {
                        aliveChains.delete(c);
                        changed = true;
                    }
                });
            }

            let secured = 0;
            aliveChains.forEach(c => secured += chains[c].length);
            enclosedRegions.forEach(r => {
                const reg = regions[r];
                const blackFree = reg.points.every(p => board[p] === null);
                const vitalToSome = [...reg.borders].some(c => isVital(reg, c));
                if (blackFree && vitalToSome) secured += reg.points.length;
            });
            return secured;
        }

        // Black's best possible score is everything White has not secured
        function playerCannotWin() {
            const secured = whiteSecuredPoints();
            return TOTAL_NODES - secured < secured + komi;
        }

        let outlookShown = false;
        function updateOutlook() {
            const el = document.getElementById('outlook');
            if (gameOver || scoring || !playerCannotWin()) {
                el.classList.add('hidden');
                return;
            }
            el.classList.remove('hidden');
            if (!outlookShown) {
                outlookShown = true;
                showToast(t('outlook'));
            }
        }

        // --- GAME END ---
        // Both passed: show the estimated dead stones and territory, and let the player fix them
        function startScoring() {
            scoring = true;
            isCPUTurn = false;
            scoringDead = estimateDeadStones('B');
            document.getElementById('scoring').classList.remove('hidden');
            document.getElementById('btn-pass').classList.add('hidden');
            document.getElementById('btn-resign').classList.add('hidden');
            document.getElementById('btn-confirm').classList.remove('hidden');
            updateUI();
            updateScoringPreview();
            updateOutlook();
            showToast(t('gameOver'));
        }

        function updateScoringPreview() {
            let score = computeScore(scoringDead);
            document.getElementById('scoring-score').textContent =
                `${t('scoringTitle')}\n${t('resultScore')(score.B, score.W, komi)}`;
        }

        // Tapping a stone switches its whole group between alive and dead
        function toggleDead(index) {
            let grp = getGroup(index);
            let makeDead = !scoringDead.has(index);
            grp.forEach(n => makeDead ? scoringDead.add(n) : scoringDead.delete(n));
            updateBoardVisuals();
            updateScoringPreview();
        }

        function endGame() {
            gameOver = true;
            scoring = false;
            isCPUTurn = false;
            komiSelect.disabled = true; // Result is final
            document.getElementById('scoring').classList.add('hidden');
            document.getElementById('btn-confirm').classList.add('hidden');
            document.getElementById('btn-pass').classList.remove('hidden');
            document.getElementById('btn-resign').classList.remove('hidden');
            updateUI(); // Clear turn highlight and illegal-point markers
            let score = computeScore(scoringDead);
            let winner = score.B > score.W ? t('playerWins') : t('cpuWins');
            showResult(`${t('resultScore')(score.B, score.W, komi)}\n${winner}`);
            updateOutlook(); // Hidden once the result is shown
        }

        function resign(score) {
            gameOver = true;
            isCPUTurn = false;
            komiSelect.disabled = true; // Result is final
            updateUI(); // Clear turn highlight and illegal-point markers
            showResult(`${t('cpuResigns')}\n${t('resultScore')(score.B, score.W, komi)}\n${t('winByResign')}`);
            updateOutlook(); // Hidden once the result is shown
            showToast(t('cpuResigns'));
        }

        // The player gives up: the CPU wins. Score shown with estimated dead stones removed.
        function playerResign() {
            const score = computeScore(estimateDeadStones(currentPlayer));
            cpuToken++; // Ignore a move the CPU may still be thinking about
            setThinking(false);
            gameOver = true;
            isCPUTurn = false;
            komiSelect.disabled = true; // Result is final
            updateUI(); // Clear turn highlight and illegal-point markers
            showResult(`${t('playerResigns')}\n${t('resultScore')(score.B, score.W, komi)}\n${t('cpuWinsByResign')}`);
            updateOutlook(); // Hidden once the result is shown
            showToast(t('playerResigns'));
        }

        function showResult(text) {
            const el = document.getElementById('result');
            el.textContent = text;
            el.classList.remove('hidden');
        }

        function passTurn() {
            if (gameOver) return;
            consecutivePasses++;
            let msg = currentPlayer === 'B' ? t('playerPassed') : t('cpuPassed');
            currentPlayer = currentPlayer === 'B' ? 'W' : 'B';
            updateUI();

            if (consecutivePasses >= 2) {
                startScoring();
            } else {
                showToast(msg);
                if (currentPlayer === 'W') {
                    isCPUTurn = true;
                    setTimeout(playCPU, 500);
                } else {
                    isCPUTurn = false;
                }
            }
        }

        // --- VISUAL & UI UPDATES ---

        function updateBoardVisuals() {
            // Stones in atari (one liberty left), for both colors
            let inAtari = new Set();
            ['B', 'W'].forEach(color => {
                findGroups(color).forEach(grp => {
                    if (getLiberties(grp) === 1) grp.forEach(n => inAtari.add(n));
                });
            });

            // Illegal points are shown only while Black is to move
            const showIllegal = !gameOver && !scoring && currentPlayer === 'B';

            // Last-move dot, on the outside of the stone (hidden if that stone was captured)
            lastMoveMarker.visible = !scoringDead && lastMove >= 0 && board[lastMove] !== null;
            if (lastMoveMarker.visible) {
                const p = points[lastMove];
                lastMoveMarker.position.copy(p).setLength(p.length() + 0.55);
            }

            if (scoringDead) {
                showScoringBoard();
                return;
            }

            for(let i = 0; i < TOTAL_NODES; i++){
                let mesh = nodeMeshes[i];
                if(board[i] === 'B') {
                    mesh.material = matBlack;
                    mesh.scale.set(1, 1, 1);
                } else if(board[i] === 'W') {
                    mesh.material = matWhite;
                    mesh.scale.set(1, 1, 1);
                } else if(showIllegal && !isLegalMove(i, 'B')) {
                    mesh.material = matIllegal;
                    mesh.scale.set(0.3, 0.3, 0.3);
                } else {
                    mesh.material = matEmpty;
                    mesh.scale.set(0.2, 0.2, 0.2); // Shrink back to empty indicator
                }
                mesh.userData.halo.visible = inAtari.has(i);
            }
        }

        // Result view: dead stones faded, territory marked with its owner's color
        function showScoringBoard() {
            let owner = areaOwnership(boardWithoutDead(scoringDead));
            for (let i = 0; i < TOTAL_NODES; i++) {
                let mesh = nodeMeshes[i];
                mesh.userData.halo.visible = false;
                if (board[i] !== null && scoringDead.has(i)) {
                    mesh.material = board[i] === 'B' ? matBlackDead : matWhiteDead;
                    mesh.scale.set(1, 1, 1);
                } else if (board[i] !== null) {
                    mesh.material = board[i] === 'B' ? matBlack : matWhite;
                    mesh.scale.set(1, 1, 1);
                } else if (owner[i]) {
                    mesh.material = owner[i] === 'B' ? matTerritoryB : matTerritoryW;
                    mesh.scale.set(0.35, 0.35, 0.35);
                } else {
                    mesh.material = matEmpty;
                    mesh.scale.set(0.2, 0.2, 0.2);
                }
            }
        }

        // Would this move be legal (not suicide, no repeated position)? Board is left unchanged.
        function isLegalMove(index, color) {
            if (board[index] !== null) return false;
            const saved = [...board];
            const enemy = color === 'B' ? 'W' : 'B';
            board[index] = color;
            findGroups(enemy).forEach(grp => {
                if (getLiberties(grp) === 0) grp.forEach(n => board[n] = null);
            });
            const legal = getLiberties(getGroup(index)) > 0 && !positionHistory.has(boardKey(board));
            board = saved;
            return legal;
        }

        function updateUI() {
            document.getElementById('score-B').innerText = captures.B;
            document.getElementById('score-W').innerText = captures.W;

            const pnlB = document.getElementById('pnl-B');
            const pnlW = document.getElementById('pnl-W');

            if(gameOver || scoring) {
                // No one is to move: drop both highlights
                pnlB.classList.remove('border-blue-400', 'bg-blue-500/20', 'opacity-50');
                pnlW.classList.remove('border-red-400', 'bg-red-500/20', 'opacity-50');
                pnlB.classList.add('border-transparent');
                pnlW.classList.add('border-transparent');
            } else if(currentPlayer === 'B') {
                pnlB.classList.add('border-blue-400', 'bg-blue-500/20');
                pnlB.classList.remove('border-transparent', 'opacity-50');
                pnlW.classList.add('border-transparent', 'opacity-50');
                pnlW.classList.remove('border-red-400', 'bg-red-500/20');
            } else {
                pnlW.classList.add('border-red-400', 'bg-red-500/20');
                pnlW.classList.remove('border-transparent', 'opacity-50');
                pnlB.classList.add('border-transparent', 'opacity-50');
                pnlB.classList.remove('border-blue-400', 'bg-blue-500/20');
            }

            updateBoardVisuals(); // Illegal-point markers depend on whose turn it is
        }

        // UI Buttons
        document.getElementById('btn-pass').addEventListener('click', () => {
            // Only the player (Black) may press Pass, and only on their own turn
            if (gameOver || scoring || isCPUTurn || currentPlayer !== 'B') return;
            passTurn();
        });

        const resignButton = document.getElementById('btn-resign');
        let resignArmed = null; // Timer while waiting for the second tap
        function disarmResign() {
            clearTimeout(resignArmed);
            resignArmed = null;
            resignButton.textContent = t('resign');
        }
        resignButton.addEventListener('click', () => {
            if (gameOver || scoring) return;
            if (!resignArmed) {
                resignButton.textContent = t('resignConfirm');
                resignArmed = setTimeout(disarmResign, 3000);
                return;
            }
            disarmResign();
            playerResign();
        });

        document.getElementById('btn-confirm').addEventListener('click', () => {
            if (scoring) endGame();
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            board.fill(null);
            currentPlayer = 'B';
            isCPUTurn = false;
            captures = { B: 0, W: 0 };
            positionHistory = new Set([boardKey(board)]);
            consecutivePasses = 0;
            gameOver = false;
            scoring = false;
            scoringDead = null;
            lastMove = -1;
            cpuToken++; // Drop any answer the CPU is still working on
            disarmResign();
            setThinking(false);
            document.getElementById('scoring').classList.add('hidden');
            document.getElementById('btn-confirm').classList.add('hidden');
            document.getElementById('btn-pass').classList.remove('hidden');
            document.getElementById('btn-resign').classList.remove('hidden');
            komiSelect.disabled = false; // Keep the chosen komi for the next game
            outlookShown = false;
            updateOutlook();
            document.getElementById('result').classList.add('hidden');
            updateBoardVisuals();
            updateUI();
            showToast(t('gameReset'));
        });

        // Komi can be changed mid-game; it is read when the score is computed
        const komiSelect = document.getElementById('komi-select');
        komiSelect.addEventListener('change', () => {
            komi = parseFloat(komiSelect.value);
            showToast(t('komiChanged')(komi));
            updateOutlook(); // Komi changes how much Black needs
            if (scoring) updateScoringPreview();
        });

        // Toast Notification System
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            msgEl.innerText = message;
            
            toast.classList.remove('hidden');
            toast.classList.remove('toast-animate');
            void toast.offsetWidth; // trigger reflow
            toast.classList.add('toast-animate');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // --- CPU LEVEL AND MONTE CARLO WORKER ---
        const CPU_THINK_MS = { normal: 700, hard: 2500 }; // Thinking time per move
        let cpuLevel = 'normal';
        let cpuToken = 0; // Answers for an older request (e.g. before a reset) are ignored

        let cpuWorker = null;
        try {
            const src = document.getElementById('cpu-worker').textContent;
            cpuWorker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
        } catch (e) {
            cpuWorker = null; // Falls back to the easy CPU
        }

        if (cpuWorker) {
            cpuWorker.onmessage = (e) => {
                const { token, move } = e.data;
                if (token !== cpuToken) return;
                setThinking(false);
                if (gameOver || scoring || currentPlayer !== 'W') return;
                if (move < 0) {
                    cpuHasNoMove();
                    return;
                }
                attemptMove(move);
                if (currentPlayer === 'W') playHeuristic(); // Should not happen; never leave the CPU stuck
            };
        }

        // The CPU panel pulses while the CPU is thinking
        function setThinking(on) {
            document.getElementById('pnl-W').classList.toggle('animate-pulse', on);
        }

        const levelSelect = document.getElementById('level-select');
        levelSelect.addEventListener('change', () => {
            cpuLevel = levelSelect.value;
            showToast(t('levelChanged')(levelSelect.options[levelSelect.selectedIndex].textContent));
        });

        // --- FOLLOWING THE CPU'S MOVES ---
        // Remembered per browser; works without storage too
        function followCpuMoves() {
            return document.getElementById('follow-cpu').checked;
        }
        try {
            if (localStorage.getItem('followCpu') === 'off') document.getElementById('follow-cpu').checked = false;
        } catch (e) {}
        document.getElementById('follow-cpu').addEventListener('change', () => {
            try { localStorage.setItem('followCpu', followCpuMoves() ? 'on' : 'off'); } catch (e) {}
        });

        // Turn the ball smoothly so that the given point faces the player
        function focusOn(index) {
            const from = camera.position.clone().normalize();
            const to = points[index].clone().normalize();
            if (from.angleTo(to) < THREE.MathUtils.degToRad(25)) return; // Already in view
            focusAnim = {
                start: performance.now(),
                startPos: camera.position.clone(),
                turn: new THREE.Quaternion().setFromUnitVectors(from, to)
            };
        }

        function stepFocus() {
            const DURATION = 700; // ms
            let t = Math.min((performance.now() - focusAnim.start) / DURATION, 1);
            t = t * t * (3 - 2 * t); // Ease in and out
            const q = new THREE.Quaternion().slerp(focusAnim.turn, t);
            camera.position.copy(focusAnim.startPos).applyQuaternion(q);
            if (t >= 1) focusAnim = null;
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            if (focusAnim) stepFocus();
            controls.update(); // Required for damping
            updateBackground();
            renderer.render(scene, camera);
        }

    </script>
</body>
